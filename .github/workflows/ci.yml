name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required check 1: lint, typecheck, unit tests, build.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Public, non-secret placeholders so the build can run in CI.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_KEY: ci-placeholder-key

  # Required check 2: permission rules (RLS) against a real Postgres.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local database and apply migrations
        run: supabase db start

      - name: Lint database functions
        run: supabase db lint --schema public --fail-on error

      - name: Permission tests (pgTAP)
        run: supabase test db

      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local > src/lib/database.types.ts
          git diff --exit-code -- src/lib/database.types.ts
